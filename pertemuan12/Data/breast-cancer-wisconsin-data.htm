    <script nonce="L1S/SB6zN2yncUJk9GAHlg==" type="application/ld+json">{"@context":"http://schema.org/","@type":"Dataset","name":"Breast Cancer Wisconsin (Diagnostic) Data Set","description":"Features are computed from a digitized image of a fine needle aspirate (FNA) of a breast mass. They describe characteristics of the cell nuclei present in the image. \nn the 3-dimensional space is that described in: [K. P. Bennett and O. L. Mangasarian: \"Robust Linear Programming Discrimination of Two Linearly Inseparable Sets\", Optimization Methods and Software 1, 1992, 23-34]. \n\nThis database is also available through the UW CS ftp server: \nftp ftp.cs.wisc.edu \ncd math-prog/cpo-dataset/machine-learn/WDBC/\n\nAlso can be found on UCI Machine Learning Repository: https://archive.ics.uci.edu/ml/datasets/Breast+Cancer+Wisconsin+%28Diagnostic%29\n\nAttribute Information:\n\n1) ID number \n2) Diagnosis (M = malignant, B = benign) \n3-32) \n\nTen real-valued features are computed for each cell nucleus: \n\na) radius (mean of distances from center to points on the perimeter) \nb) texture (standard deviation of gray-scale values) \nc) perimeter \nd) area \ne) smoothness (local variation in radius lengths) \nf) compactness (perimeter^2 / area - 1.0) \ng) concavity (severity of concave portions of the contour) \nh) concave points (number of concave portions of the contour) \ni) symmetry \nj) fractal dimension (\"coastline approximation\" - 1)\n\nThe mean, standard error and \"worst\" or largest (mean of the three\nlargest values) of these features were computed for each image,\nresulting in 30 features.  For instance, field 3 is Mean Radius, field\n13 is Radius SE, field 23 is Worst Radius.\n\nAll feature values are recoded with four significant digits.\n\nMissing attribute values: none\n\nClass distribution: 357 benign, 212 malignant","url":"https://www.kaggle.com/uciml/breast-cancer-wisconsin-data","version":2,"keywords":["subject, health and fitness, health, health conditions, cancer","subject, health and fitness, health, healthcare"],"license":{"@type":"CreativeWork","name":"CC BY-NC-SA 4.0","url":"https://creativecommons.org/licenses/by-nc-sa/4.0/"},"identifier":["180"],"includedInDataCatalog":{"@type":"DataCatalog","name":"Kaggle","url":"https://www.kaggle.com"},"creator":{"@type":"Organization","name":"UCI Machine Learning","url":"https://www.kaggle.com/organizations/uciml","image":"https://storage.googleapis.com/kaggle-organizations/7/thumbnail.png"},"distribution":[{"@type":"DataDownload","requiresSubscription":true,"encodingFormat":"zip","fileFormat":"zip","contentUrl":"https://www.kaggle.com/datasets/uciml/breast-cancer-wisconsin-data/download?datasetVersionNumber=2","contentSize":"49796 bytes"}],"commentCount":53,"dateModified":"2016-09-25T10:49:04.067Z","discussionUrl":"https://www.kaggle.com/uciml/breast-cancer-wisconsin-data/discussion","alternateName":"Predict whether the cancer is benign or malignant","isAccessibleForFree":true,"thumbnailUrl":"https://storage.googleapis.com/kaggle-datasets-images/180/384/3da2510581f9d3b902307ff8d06fe327/dataset-card.jpg","interactionStatistic":[{"@type":"InteractionCounter","interactionType":"http://schema.org/CommentAction","userInteractionCount":53},{"@type":"InteractionCounter","interactionType":"http://schema.org/DownloadAction","userInteractionCount":506126},{"@type":"InteractionCounter","interactionType":"http://schema.org/ViewAction","userInteractionCount":2469883},{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":3943}]}</script>
